[project]
name = "sasol-customer-value"
version = "0.1.0"
description = "Sasol Loyalty Customer Value & Opportunity Prediction on Zindi"
readme = "README.md"
authors = [
    { name = "amogelang-ramatlo", email = "amogelang.ramatlo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "ipykernel>=6.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

